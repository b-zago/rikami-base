service:
  name: {{ .Name }}-service
  runsOn: {{ .Name }}
  port: 5432
  targetPort: 5432
  clusterIP: None
secret:
  name: {{ .Name }}-envs
  runsOnList: [{{ .Name }}]
  data: {{ .Values.data }}
statefulSet:
  name: {{ .Name }}
  runsOn: postgres
  image: {{ .Values.image | default "postgres:18-alpine"}}
  imagePullSecrets: {{ .Values.imagePullSecrets | default "ghcr-creds"}}
  containerPort: 5432
  component: {{ .Values.component | default "database" }}
  mountPath: /var/lib/postgresql
  storage: {{ .Values.storage }}
  envSecretRefs: [{{ .Name }}-envs]
