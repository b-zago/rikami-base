route:
  name: {{ .Name }}-route
  runsOn: {{ .Name }}-service
  host: {{ .App }}.{{ .Domain }}

deployment:
  name: {{ .Name }}
  image: {{ .Values.image }}
  imagePullSecrets: {{ .Values.imagePullSecrets | default "ghcr-creds"}}
  runsOn: {{ .Values.runsOn }}
  component: {{ .Values.component | default "server"}}
  containerPort: {{ .Values.port }}

service:
  name: {{ .Name }}-service
  runsOn: {{ .Name }}
  port: {{ .Values.servicePort | default 80}}
  targetPort: {{ .Values.port }}


